name: Deploy browser game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.64
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apt-get update && apt-get install -y git make

      - name: Build raylib and the game
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git "$RUNNER_TEMP/raylib"
          emmake make -C "$RUNNER_TEMP/raylib/src" PLATFORM=PLATFORM_WEB RAYLIB_LIBTYPE=STATIC
          mkdir -p build/web
          em++ -std=c++17 -O2 -Wall -Wextra -DPLATFORM_WEB -DGRAPHICS_API_OPENGL_ES2 \
            -I"$RUNNER_TEMP/raylib/src" main.cpp -L"$RUNNER_TEMP/raylib/src" -lraylib \
            -sUSE_GLFW=3 -sASYNCIFY -sALLOW_MEMORY_GROWTH=1 \
            -sMIN_WEBGL_VERSION=1 -sMAX_WEBGL_VERSION=2 \
            -o build/web/index.html
          touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
